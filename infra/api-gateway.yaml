# API Gateway routes for the five P0 screens (PRD §15 + docs/contract.md),
# plus the Task 6 Day-1 skeleton: one Step Functions state machine with a
# single Task state invoking one stub Lambda (backend/handlers/
# orchestrator_stub.py), proving Step Functions -> Lambda deploys and runs
# end to end. This is a smoke test, not the real orchestrator — the actual
# parallel research -> Synthesis -> Evidence Check -> Quality Gate graph
# (§10.1) is Day 2 work.
#
# AWS SAM template. Defines the HTTP API surface and routes it to the Task 2
# stub Lambda handlers (backend/handlers/*_stub.py) so the frontend can hit
# real URLs today, not mocks.
#
# Amplify Hosting isn't in this template: it needs a GitHub App console
# connection (a human-in-the-loop step, not something a CloudFormation
# resource can complete unattended) and has nothing to host until Task 7's
# React scaffold exists. Task 7 owns wiring that pipeline.
#
# Every API Gateway route below has a matching handler in backend/handlers/
# and a matching Pydantic response type in backend/schemas/entities.py —
# see docs/contract.md for the full table (method, path, purpose, screen, type).

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Opportunity Engine — P0 API surface (stub Lambdas, Task 2)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    # Repo root, not ../backend/: every handler imports as `from backend.X
    # import Y` (same as the pytest suite, run from repo root), so `backend`
    # has to exist as a real package at the Lambda's runtime root too.
    # requirements.txt at repo root points at backend/requirements-lambda.txt
    # (pydantic + boto3 only) rather than backend/requirements.txt: none of
    # these 10 functions import strands-agents/mcp, and pulling it in anyway
    # dragged mcp's Windows-only pywin32 dependency into `sam build`'s local
    # pip resolution — a symlinked-CodeUri fix to also drop the ~90MB of
    # unrelated frontend/node_modules that rides along was tried and reverted
    # (this repo's git-for-windows has core.symlinks=false, so the "symlink"
    # became a second, real, driftable copy of backend/ once committed — a
    # worse problem than the packaging bloat it was solving). 128MB is well
    # under Lambda's 250MB unzipped limit, so the bloat stays, uncorrected.
    # See frontend/README.md blocker 6.
    CodeUri: ../
    # Every *_stub.py handler reads via backend/handlers/_common.py::dynamo_get/
    # dynamo_children, which fall back to `DYNAMO_TABLE_NAME` env var (default
    # "opportunity-engine") — the wrong, non-existent name for this stack's
    # CloudFormation-generated table. Without this, blocker 3 (frontend/README.md)
    # stays "resolved" on paper but every handler still 403s/falls back to the
    # fixture, because it can neither find nor read the real table.
    Environment:
      Variables:
        DYNAMO_TABLE_NAME: !Ref OpportunityEngineTable

Resources:
  # Task 20: single-table design for all nine core entities, keyed on the
  # Task 1 prefixes (backend/schemas/entities.py DynamoKeyPrefix) — PK/SK
  # gives get-by-id, GSI1 gives the provenance-chain list access patterns
  # (docs/contract.md). `ttl` enforces PRD §18.8's 30-day raw-text expiry
  # natively, no cleanup job. See backend/db/dynamo.py.
  OpportunityEngineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  OpportunityEngineApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # frontend/README.md blocker 4: the Amplify-hosted build (and local dev
      # via the Vite proxy) needs to call this API from a browser. GET-only,
      # no auth, no cookies — a wildcard origin is the honest scope, not a
      # workaround. ExposeHeaders is what actually matters here: without it
      # the browser drops X-Retrieval-Mode (blocker 1) before JS ever sees it.
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
        AllowHeaders:
          - Content-Type
        ExposeHeaders:
          - X-Retrieval-Mode
        MaxAge: 600

  GetBusiness:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.businesses_stub.get_business
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /businesses/{id}
            Method: GET

  GetBusinessFeedbackSummary:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.businesses_stub.get_feedback_summary
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /businesses/{id}/feedback-summary
            Method: GET

  ListOpportunities:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.opportunities_stub.list_opportunities
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /businesses/{id}/opportunities
            Method: GET

  ListRejectedIdeas:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.opportunities_stub.list_rejected_ideas
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /businesses/{id}/rejected-ideas
            Method: GET

  GetOpportunity:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.opportunities_stub.get_opportunity
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /opportunities/{id}
            Method: GET

  GetExecutionPack:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.opportunities_stub.get_execution_pack
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /opportunities/{id}/execution-pack
            Method: GET

  ListClaims:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.claims_stub.list_claims
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /opportunities/{id}/claims
            Method: GET

  GetClaimEvidence:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.claims_stub.get_claim_evidence
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OpportunityEngineTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /claims/{id}/evidence
            Method: GET

  ListCompetitors:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.competitors_stub.list_competitors
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /competitors
            Method: GET

  GetCompetitorEvidenceLive:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.competitors_stub.get_competitor_evidence_live
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpportunityEngineApi
            Path: /competitors/{id}/evidence/{evidenceId}/live
            Method: GET

  RunOrchestratorStub:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.orchestrator_stub.run_stub

  SkeletonOrchestrator:
    Type: AWS::Serverless::StateMachine
    Properties:
      Definition:
        StartAt: RunOrchestrator
        States:
          RunOrchestrator:
            Type: Task
            Resource: !GetAtt RunOrchestratorStub.Arn
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RunOrchestratorStub

Outputs:
  ApiUrl:
    Description: Base URL for the P0 API surface
    Value: !Sub "https://${OpportunityEngineApi}.execute-api.${AWS::Region}.amazonaws.com/"

  SkeletonOrchestratorArn:
    Description: Step Functions state machine ARN for the Task 6 Day-1 skeleton
    Value: !Ref SkeletonOrchestrator

  DynamoTableName:
    Description: Single table holding all nine core entities (Task 20)
    Value: !Ref OpportunityEngineTable
